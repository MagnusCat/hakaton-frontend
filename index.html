<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>МедКлиника — расписание врачей</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231976d2'/%3E%3Cpath d='M42 20h16v22h22v16H58v22H42V58H20V42h22z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <section id="login-view" class="login-view hidden">
      <div class="login-card">
        <div class="login-logo">Мед<span>Клиника</span></div>

        <div id="auth-login">
          <h1>Вход в систему</h1>
          <form id="login-form" novalidate>
            <label for="login-input">Логин</label>
            <input id="login-input" type="text" autocomplete="username" required />

            <label for="password-input">Пароль</label>
            <input id="password-input" type="password" autocomplete="current-password" required />

            <div id="login-error" class="form-error hidden" role="alert"></div>

            <button type="submit" class="btn btn-primary btn-block">Войти</button>
          </form>
          <p class="auth-switch">
            Нет аккаунта?
            <button type="button" id="show-register" class="link-btn">Зарегистрироваться как пациент</button>
          </p>
          <div class="login-hint">
            Демо-доступ:<br>
                         админ:<code>admin / admin123</code>
          </div>
        </div>

        <div id="auth-register" class="hidden">
          <h1>Регистрация пациента</h1>
          <form id="register-form" novalidate>
            <label for="reg-first-name">Имя</label>
            <input id="reg-first-name" type="text" autocomplete="given-name" required />

            <label for="reg-last-name">Фамилия</label>
            <input id="reg-last-name" type="text" autocomplete="family-name" required />

            <label for="reg-login">Логин</label>
            <input id="reg-login" type="text" autocomplete="username" required minlength="3" />

            <label for="reg-password">Пароль (минимум 4 символа)</label>
            <input id="reg-password" type="password" autocomplete="new-password" required minlength="4" />

            <div id="register-error" class="form-error hidden" role="alert"></div>

            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
          </form>
          <p class="auth-switch">
            Уже есть аккаунт?
            <button type="button" id="show-login" class="link-btn">Войти</button>
          </p>
        </div>
      </div>
    </section>

    <section id="main-view" class="main-view hidden">
      <header class="header">
        <div class="header-logo">Мед<span>Клиника</span></div>
        <nav id="nav" class="nav"></nav>
        <div class="header-user">
          <span id="current-user"></span>
          <button id="logout-btn" class="btn btn-ghost">Выйти</button>
        </div>
      </header>

      <main id="view" class="view"></main>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
